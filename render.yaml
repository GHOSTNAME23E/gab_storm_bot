services:
  - type: worker
    name: gab-storm-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_IDS
        value: "1205345667271102477"
      - key: LOG_CHANNEL_ID
        value: "1566512212523229425"
      - key: RESET_LOG_CHANNEL_ID
        value: "1566512212523229425"
      - key: CLIENT_RESET_CHANNEL_ID
        value: "1566512592158195732"
      - key: CLIENT_RESET_ROLE_ID
        value: "1563611112690159690"
      - key: KEYAUTH_PRODUCT_1
        sync: false
      - key: KEYAUTH_PRODUCT_2
        sync: false
